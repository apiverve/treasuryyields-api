openapi: 3.0.4
info:
  title: Treasury Yields
  description: >-
    Treasury Yields provides current and historical US Treasury
    constant-maturity market yields across the full curve (1-month through
    30-year), plus TIPS real yields. Paid plans add curve spreads, inversion
    flags, the curve's shape and breakeven inflation for yield curve analysis.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/treasuryyields:
    get:
      summary: Treasury Yields
      description: Get current or historical Treasury securities interest rates
      operationId: treasuryyields
      parameters:
        - name: date
          in: query
          schema:
            type: string
          required: false
          description: >-
            Optional month in YYYY-MM format, back to 2010-01; returns that
            month's closing curve. Omit for the latest daily curve.
          example: 2025-06
        - name: type
          in: query
          schema:
            type: string
          required: false
          description: >-
            Optional filter for a single point. Legacy security types: bills,
            notes, bonds, tips, frn. Or a maturity: 1mo, 3mo, 6mo, 1yr, 2yr,
            3yr, 5yr, 7yr, 10yr, 20yr, 30yr
          example: 10yr
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  date: '2026-10-23'
                  yields:
                    1mo: 4.11
                    3mo: 4.22
                    6mo: 4.3
                    1yr: 4.44
                    2yr: 4.69
                    3yr: 4.75
                    5yr: 4.82
                    7yr: 4.89
                    10yr: 5
                    20yr: 5.37
                    30yr: 5.33
                  realYields:
                    5yr: 2.34
                    7yr: 2.49
                    10yr: 2.66
                    20yr: 2.94
                    30yr: 3.08
                  bills: 4.22
                  notes: 5
                  bonds: 5.33
                  tips: 2.66
                  frn: 4.22
                  changes:
                    bills:
                      change1d: 0
                      direction: unchanged
                    notes:
                      change1d: 0.04
                      direction: up
                    bonds:
                      change1d: 0.04
                      direction: up
                    tips:
                      change1d: 0.02
                      direction: up
                    frn:
                      change1d: 0
                      direction: unchanged
                    1mo:
                      change1d: 0
                      direction: unchanged
                    3mo:
                      change1d: 0
                      direction: unchanged
                    6mo:
                      change1d: 0.01
                      direction: up
                    1yr:
                      change1d: 0.03
                      direction: up
                    2yr:
                      change1d: 0.04
                      direction: up
                    3yr:
                      change1d: 0.03
                      direction: up
                    5yr:
                      change1d: 0.04
                      direction: up
                    7yr:
                      change1d: 0.03
                      direction: up
                    10yr:
                      change1d: 0.04
                      direction: up
                    20yr:
                      change1d: 0.05
                      direction: up
                    30yr:
                      change1d: 0.04
                      direction: up
                  spread10yr2yr: 0.31
                  spread10yr3mo: 0.78
                  spread30yr5yr: 0.51
                  spread5yr2yr: 0.13
                  inverted10yr2yr: false
                  inverted10yr3mo: false
                  curveShape: normal
                  breakevenInflation:
                    5yr: 2.48
                    7yr: 2.4
                    10yr: 2.34
                    20yr: 2.43
                    30yr: 2.25
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
